# ---------- OWNER (access control) ----------
# The username that gets the Owner Console: approving who may use the
# app, assigning roles, suspending accounts.
#
# This is read from HERE, not from the database, on purpose. If "owner"
# were a database role, anyone who could write that table — directly
# with the anon key, or through a bug in a role-editing screen — could
# make themselves owner. Anchoring it to secrets.toml means taking
# ownership requires access to the deployment config.
#
# Set this to the username you create in the first-run setup form.
OWNER_USERNAME = "CHANGE-ME-to-your-username"

# ---------- RECOMMENDED ----------
# Public URL of the deployed app. Password-reset emails link here, so a
# wrong value produces reset links that go nowhere.
APP_URL = "http://localhost:8501"

# Salt for private-chat key derivation. Freshly generated for you.
# NOTE: this does NOT make private chat end-to-end encrypted — see the
# warning shown in the app itself.
CHAT_KEY_SALT = "0jUCRDs_uEsWXmxOsFJYeCGScJccBRILWw9T-WsfAQy4y3bHlqNJDqC2Gsx34had"

# Minutes of inactivity before logout. Lower this for shared terminals.
SESSION_TIMEOUT_MINUTES = 60

# Per-file upload cap, in MB.
MAX_UPLOAD_SIZE_MB = 5

# ---------- OPTIONAL: email notifications ----------
# Leave commented out and the app silently skips email (no errors).
# For Gmail/Workspace, SMTP_PASSWORD must be an App Password.
# SMTP_SERVER   = "smtp.gmail.com"
# SMTP_PORT     = 587
# SMTP_USER     = "maintenance-noreply@yourcompany.com"
# SMTP_PASSWORD = "your-app-specific-password"
# SMTP_FROM     = "maintenance-noreply@yourcompany.com"

# ---------- OPTIONAL: Slack / Teams alerts ----------
# High/Critical incidents and safety-flagged handovers post here.
# SLACK_WEBHOOK = "https://hooks.slack.com/services/..."
# TEAMS_WEBHOOK = "https://yourorg.webhook.office.com/..."

