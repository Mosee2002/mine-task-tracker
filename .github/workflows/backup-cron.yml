name: Weekly Database Backup

# Same rewrite as Automation Triggers: runs directly against Supabase
# rather than calling a Streamlit endpoint, which Streamlit Community
# Cloud blocks with an auth-redirect loop. See automation/mwdts_automation.py.
#
# Known limit worth watching as data grows: most SMTP providers cap
# attachments around 10-25MB. The script reports the ZIP size in its
# JSON output every run, so you can see it trending upward well before
# it becomes a failure.
on:
  schedule:
    - cron: '0 2 * * 0'    # Sunday 02:00 UTC
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      OWNER_USERNAME: ${{ secrets.OWNER_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Run backup
        run: python automation/mwdts_automation.py backup
