# Copy this file to .streamlit/secrets.toml and fill in your real values.
# Never commit the filled-in secrets.toml to version control â€”
# add ".streamlit/secrets.toml" to your .gitignore.

SUPABASE_URL = "https://YOUR-PROJECT-REF.supabase.co"
SUPABASE_KEY = "YOUR-ANON-PUBLIC-KEY"

# Optional
SESSION_TIMEOUT_MINUTES = 60
MAX_UPLOAD_SIZE_MB = 5
APP_URL = "https://yourapp.streamlit.app"

# Optional: email notifications
SMTP_SERVER = ""
SMTP_PORT = 587
SMTP_USER = ""
SMTP_PASSWORD = ""
SMTP_FROM = ""

# Optional: Slack / Teams webhooks
SLACK_WEBHOOK = ""
TEAMS_WEBHOOK = ""

# Optional: Google OAuth (login page shows a Google button if these are set)
GOOGLE_CLIENT_ID = ""
GOOGLE_CLIENT_SECRET = ""
GOOGLE_REDIRECT_URI = ""
