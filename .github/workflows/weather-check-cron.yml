name: Weather Check Trigger

# Streamlit has no built-in background job scheduler at all — the
# app's own weather-check code (run_weather_email_check, in app.py)
# can only ever run when something actually calls it, and it was
# only ever wired up to a manual "check now" button in Owner Console
# plus this automation endpoint — which nothing was actually pinging
# on a timer, which is exactly why the automatic emails never came.
#
# This workflow is that missing timer. It runs hourly and does
# nothing but a single HTTP GET to the app's own automation-trigger
# endpoint — the app's OWN code (run_weather_email_check) decides
# every time whether an email is actually due yet, based on its own
# cooldown tracking (12-hourly for routine forecasts, 6-hourly for
# active bad-weather alerts) — so running this hourly doesn't mean
# hourly emails, it just means the check happens often enough that
# a due email is never delayed by more than an hour.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}   # lets you trigger a manual test run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the weather-check automation endpoint
        run: |
          curl -sf "https://mine-task-tracker-ljc2ppwmwiwtfqwykn2by5.streamlit.app/?weather_check=1&token=${{ secrets.AUTOMATION_TRIGGER_TOKEN }}" \
            -o response.json
          cat response.json
        # -f makes curl itself fail (non-zero exit) on an HTTP error
        # status, so a broken URL/token shows up as a failed red run
        # in the Actions tab rather than silently doing nothing.
