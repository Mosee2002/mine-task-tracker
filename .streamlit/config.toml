# Place this at .streamlit/config.toml
#
# Why this file matters: injected CSS cannot reliably restyle every part
# of Streamlit's own widget chrome, and it only applies *after* the page
# paints. Setting the native theme here means the app renders readably
# from the first frame instead of flashing unstyled light-grey text, and
# it gives dropdowns, sliders, and date pickers correct contrast without
# fighting them with !important rules.
#
# This sets the LIGHT baseline. The in-app "Toggle Theme" button layers
# dark CSS variables on top at runtime.

[theme]
base = "light"

# Primary interactive colour. 6.3:1 against white â€” passes WCAG AA for
# normal text, so it is safe for links and button fills with white text.
primaryColor = "#1d4ed8"

# App background: a soft grey-blue rather than pure white, which reduces
# glare on bright screens without dropping text contrast.
backgroundColor = "#eef1f6"

# Cards, inputs, and containers sit on this.
secondaryBackgroundColor = "#ffffff"

# Body text. 16.9:1 on white / 15.1:1 on the app background.
# For the record: Streamlit's own default (#31333F) measures 12.5:1 and
# was NOT the problem. The original readability issue came from dead CSS
# selectors and pale custom colours in the app's own stylesheet.
# This value is set mainly for consistency with the CSS tokens.
textColor = "#101828"

font = "sans serif"

# "server.enableStaticFileServing" REMOVED as of Streamlit 1.61.1 â€” the
# live app logs showed: '"server.enableStaticFileServing" is not a
# valid config option. If you previously had this config option set,
# it may have been removed.' That exact wording is what Streamlit shows
# when a setting becomes unnecessary because the feature it used to
# gate is now on by default, not when a capability is deleted outright
# â€” so this is a genuine test of whether static/ files (sw.js,
# push-setup.html) now serve automatically without needing this flag
# at all in this Streamlit version. If the sw.js diagnostic is STILL
# red after deploying this, that theory is wrong and static file
# serving needs a different, version-appropriate config key â€” check
# Streamlit's current docs for whatever 1.61.1 actually calls this.
[server]
# Keeps uploads bounded; the app also enforces its own per-file limit.
maxUploadSize = 10

[browser]
gatherUsageStats = false
